[platformio]
default_envs = esp32-s3-devkitc-1-16mb

[env]
monitor_dtr = 0
monitor_rts = 0
platform = espressif32 @ ~6.5.0
board = esp32-s3-devkitc-1-16mb
framework = espidf
monitor_speed = 115200
monitor_filters = direct, esp32_exception_decoder
board_build.f_cpu = 240000000L
board_build.partitions = partitions.csv
lib_ldf_mode = deep+
build_flags =
    -Ilib

[env:esp32-s3-devkitc-1-16mb]
build_type = debug
build_flags =
    ${env.build_flags}
    -DSIMULATE_RPI_BOOT=1

[env:esp32-s3-devkitc-1-16mb-release]
build_type = release
build_flags =
    ${env.build_flags}
    -DNDEBUG