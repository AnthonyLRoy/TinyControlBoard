<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TinyRemote main screen mockup</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1215;
      --surface: #171e22;
      --surface-2: #202a2f;
      --surface-3: #2b373c;
      --text: #f3f5f4;
      --muted: #9ba7a9;
      --accent: #55d68a;
      --accent-soft: rgba(85, 214, 138, .14);
      --warning: #f0a84f;
      --danger: #ee6d62;
      --line: rgba(255, 255, 255, .09);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 0%, rgba(85, 214, 138, .09), transparent 30rem),
        linear-gradient(145deg, #0b1012, #151d21 55%, #0b1012);
      font-family: Georgia, "Times New Roman", serif;
    }

    .phone {
      width: min(100%, 390px);
      min-height: 760px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 30px;
      background: var(--bg);
      box-shadow: 0 30px 80px rgba(0,0,0,.48), 0 0 0 7px rgba(255,255,255,.025);
    }

    .status-bar {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      color: var(--muted);
      font: 11px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    main { padding: 4px 18px 24px; }
    button { font: inherit; color: inherit; cursor: pointer; }

    .device-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 2px 18px;
      border-bottom: 1px solid var(--line);
    }
    .eyebrow {
      margin: 0 0 4px;
      color: var(--muted);
      font: 10px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: 0; }
    .connection { display: flex; align-items: center; gap: 7px; color: var(--accent); font: 12px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }

    .power-row { display: flex; align-items: center; justify-content: space-between; padding: 18px 0 14px; }
    .power-label { color: var(--muted); font-size: 13px; }
    .power-state { display: block; margin-top: 3px; color: var(--accent); font-size: 24px; }
    .power-button {
      width: 48px; height: 48px; border: 1px solid rgba(238,109,98,.35); border-radius: 50%;
      background: rgba(238,109,98,.1); color: var(--danger); font-size: 21px;
    }
    .power-button:hover { background: rgba(238,109,98,.2); }

    .album {
      position: relative; display: grid; place-items: center; aspect-ratio: 1.18;
      overflow: hidden; border-radius: 14px; background: linear-gradient(135deg, #30433d, #101716 70%);
      border: 1px solid var(--line);
    }
    .album::before, .album::after { content: ""; position: absolute; border-radius: 50%; border: 1px solid rgba(255,255,255,.14); }
    .album::before { width: 210px; height: 210px; background: radial-gradient(circle, #080b0b 0 13%, #b3c1b8 14% 17%, #1c2825 18% 48%, #090c0c 49% 52%, #9ca99f 53% 55%, #111817 56%); box-shadow: 0 0 30px rgba(85,214,138,.14); }
    .album::after { width: 30px; height: 30px; background: var(--accent); border-color: rgba(0,0,0,.45); box-shadow: 0 0 0 8px #1c2723; }
    .album-caption { position: absolute; left: 16px; bottom: 14px; z-index: 1; color: rgba(255,255,255,.72); font: 10px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace; text-transform: uppercase; letter-spacing: .09em; }

    .track { padding: 16px 2px 7px; }
    .track-title { margin: 0; font-size: 21px; }
    .track-artist { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .progress { height: 4px; margin: 17px 0 7px; border-radius: 5px; background: #354044; overflow: hidden; }
    .progress span { display: block; width: 42%; height: 100%; background: var(--accent); }
    .time { display: flex; justify-content: space-between; color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Consolas, monospace; }

    .transport { display: flex; align-items: center; justify-content: center; gap: 25px; padding: 13px 0 18px; }
    .transport button, .quick button { border: 0; background: transparent; }
    .transport button { width: 44px; height: 44px; color: #cad2d0; font-size: 23px; }
    .transport .play { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: #102018; font-size: 27px; box-shadow: 0 8px 22px rgba(85,214,138,.22); }

    .section-title { display: flex; align-items: center; justify-content: space-between; margin: 5px 0 10px; color: var(--muted); font: 10px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .1em; text-transform: uppercase; }
    .section-title button { border: 0; background: none; color: var(--accent); font: inherit; letter-spacing: 0; text-transform: none; }
    .quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .quick button { min-height: 68px; display: grid; place-items: center; gap: 5px; padding: 8px 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--muted); font-size: 11px; }
    .quick button span { color: #dce3df; font-size: 21px; }
    .quick button.active { border-color: rgba(85,214,138,.55); background: var(--accent-soft); color: var(--accent); }
    .quick button.active span { color: var(--accent); }
    .library { width: 100%; margin-top: 14px; padding: 13px 15px; display: flex; justify-content: space-between; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); text-align: left; }
    .library strong { font-size: 14px; font-weight: 500; }
    .library small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
    .library b { color: var(--accent); font-size: 18px; font-weight: 400; }
    .toast { min-height: 18px; padding-top: 13px; color: var(--muted); text-align: center; font: 11px ui-monospace, SFMono-Regular, Consolas, monospace; }

    @media (max-width: 430px) {
      body { padding: 0; place-items: start center; }
      .phone { width: 100%; min-height: 100vh; border: 0; border-radius: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <section class="phone" aria-label="TinyRemote main screen mockup">
    <div class="status-bar"><span>9:41</span><span>5G &nbsp; 87%</span></div>
    <main>
      <header class="device-header">
        <div><p class="eyebrow">TinyRemote</p><h1>TinyControlBoard</h1></div>
        <div class="connection"><span class="dot"></span><span>Connected</span></div>
      </header>

      <section class="power-row">
        <div><span class="power-label">Board power</span><strong class="power-state" id="powerState">ON</strong></div>
        <button class="power-button" id="powerButton" aria-label="Power options">⏻</button>
      </section>

      <section class="album" aria-label="Album artwork preview">
        <span class="album-caption">Now playing</span>
      </section>
      <section class="track">
        <h2 class="track-title">Midnight City</h2>
        <p class="track-artist">M83 · Hurry Up, We're Dreaming</p>
        <div class="progress" aria-label="Track progress"><span id="progressBar"></span></div>
        <div class="time"><span>2:14</span><span>4:03</span></div>
      </section>

      <nav class="transport" aria-label="Playback controls">
        <button aria-label="Previous track">|◀</button>
        <button class="play" id="playButton" aria-label="Pause">Ⅱ</button>
        <button aria-label="Next track">▶|</button>
      </nav>

      <div class="section-title"><span>Board controls</span><button id="editButton">Edit</button></div>
      <div class="quick">
        <button id="shuffleButton"><span>⤨</span>Shuffle</button>
        <button id="repeatButton"><span>↻</span>Repeat</button>
        <button><span>◒</span>Display</button>
        <button><span>◉</span>Meter</button>
      </div>
      <button class="library"><span><strong>Browse library</strong><small>Albums, folders, playlists, and search</small></span><b>›</b></button>
      <div class="toast" id="toast" role="status">Ready to control your board</div>
    </main>
  </section>
  <script>
    const toast = document.getElementById('toast');
    const say = (message) => { toast.textContent = message; };
    document.getElementById('playButton').addEventListener('click', (event) => {
      const playing = event.currentTarget.textContent.trim() === 'Ⅱ';
      event.currentTarget.textContent = playing ? '▶' : 'Ⅱ';
      event.currentTarget.setAttribute('aria-label', playing ? 'Play' : 'Pause');
      say(playing ? 'Playback paused' : 'Playback resumed');
    });
    document.getElementById('shuffleButton').addEventListener('click', (event) => {
      event.currentTarget.classList.toggle('active');
      say(event.currentTarget.classList.contains('active') ? 'Shuffle enabled' : 'Shuffle disabled');
    });
    document.getElementById('repeatButton').addEventListener('click', (event) => {
      event.currentTarget.classList.toggle('active');
      say(event.currentTarget.classList.contains('active') ? 'Repeat enabled' : 'Repeat disabled');
    });
    document.getElementById('powerButton').addEventListener('click', () => say('Power options would open here'));
    document.getElementById('editButton').addEventListener('click', () => say('Customize board controls'));
  </script>
</body>
</html>
