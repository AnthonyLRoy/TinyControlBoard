<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1580" role="img" aria-labelledby="title description">
  <title id="title">Streamer and DAC system overview</title>
  <desc id="description">Control and Bluetooth connections, digital audio source selection, reclocking, two DAC paths, and RCA and XLR outputs.</desc>
  <defs>
    <marker id="arrow-control" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1769aa"/>
    </marker>
    <marker id="arrow-audio" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#c7471a"/>
    </marker>
    <marker id="arrow-analog" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#50545a"/>
    </marker>
    <marker id="arrow-ble" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#7449c6"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #263238; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #52616b; }
      .zone-title { font-size: 24px; font-weight: 700; }
      .box-title { font-size: 19px; font-weight: 700; }
      .label { font-size: 17px; }
      .small { font-size: 15px; }
      .tiny { font-size: 14px; }
      .zone { stroke-width: 2; }
      .node { stroke-width: 1.8; }
      .control { fill: none; stroke: #1769aa; stroke-width: 2.5; marker-end: url(#arrow-control); }
      .control-bidir { fill: none; stroke: #1769aa; stroke-width: 2.5; marker-start: url(#arrow-control); marker-end: url(#arrow-control); }
      .audio { fill: none; stroke: #c7471a; stroke-width: 2.8; marker-end: url(#arrow-audio); }
      .audio-bidir { fill: none; stroke: #c7471a; stroke-width: 2.8; marker-start: url(#arrow-audio); marker-end: url(#arrow-audio); }
      .analog { fill: none; stroke: #50545a; stroke-width: 2.5; marker-end: url(#arrow-analog); }
      .ble { fill: none; stroke: #7449c6; stroke-width: 2.6; stroke-dasharray: 9 6; marker-start: url(#arrow-ble); marker-end: url(#arrow-ble); }
      .wire-label { font-size: 14px; font-weight: 700; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="1580" fill="#fff"/>
  <text x="40" y="50" class="title">Streamer &amp; DAC — system overview</text>
  <text x="40" y="77" class="subtitle">Control, digital audio routing, DAC selection and analogue outputs</text>

  <!-- Control and user interface -->
  <rect x="30" y="100" width="1140" height="355" rx="22" fill="#f1f7fc" stroke="#1769aa" class="zone"/>
  <text x="55" y="135" class="zone-title" fill="#15598f">Control &amp; user interface</text>

  <rect x="65" y="170" width="190" height="62" rx="12" fill="#fff" stroke="#1769aa" class="node"/>
  <text x="160" y="207" text-anchor="middle" class="label">Interface buttons</text>
  <rect x="65" y="275" width="190" height="62" rx="12" fill="#fff" stroke="#1769aa" class="node"/>
  <text x="160" y="312" text-anchor="middle" class="label">Rotary controller</text>

  <rect x="330" y="205" width="230" height="105" rx="16" fill="#cfe5f7" stroke="#1769aa" class="node"/>
  <text x="445" y="247" text-anchor="middle" class="box-title">ESP32 control board</text>
  <text x="445" y="273" text-anchor="middle" class="small">Input · relay · system control</text>

  <rect x="65" y="365" width="260" height="62" rx="12" fill="#eee6fa" stroke="#7449c6" class="node"/>
  <text x="195" y="390" text-anchor="middle" class="box-title">Android remote</text>
  <text x="195" y="412" text-anchor="middle" class="small">TinyRemote · Bluetooth LE</text>

  <rect x="665" y="155" width="200" height="80" rx="12" fill="#fff" stroke="#1769aa" class="node"/>
  <text x="765" y="187" text-anchor="middle" class="box-title">Touch display</text>
  <text x="765" y="211" text-anchor="middle" class="small">HDMI video · touch input</text>

  <rect x="930" y="205" width="190" height="100" rx="14" fill="#e8f2df" stroke="#54832f" class="node"/>
  <text x="1025" y="243" text-anchor="middle" class="box-title">Raspberry Pi 4</text>
  <text x="1025" y="268" text-anchor="middle" class="small">moOde / MPD</text>
  <text x="1025" y="289" text-anchor="middle" class="tiny">Network streamer</text>

  <rect x="965" y="125" width="155" height="52" rx="12" fill="#fff" stroke="#7a6c56" class="node"/>
  <text x="1042" y="147" text-anchor="middle" class="small">SSD music library</text>
  <text x="1042" y="165" text-anchor="middle" class="tiny">USB storage</text>

  <path d="M255 201 H330" class="control"/>
  <path d="M255 306 H290 V275 H330" class="control"/>
  <path d="M560 285 H610 V340 H1025 V305" class="control-bidir"/>
  <text x="750" y="333" text-anchor="middle" class="wire-label" fill="#15598f">UART control / status · 921600 baud</text>
  <path d="M325 396 H445 V310" class="ble"/>
  <text x="387" y="383" text-anchor="middle" class="wire-label" fill="#56359a">BLE GATT</text>
  <path d="M445 205 V175 H665" class="control"/>
  <text x="558" y="166" text-anchor="middle" class="wire-label" fill="#15598f">Brightness PWM</text>
  <path d="M930 222 H890 V145 H765 V155" class="control"/>
  <text x="890" y="137" text-anchor="middle" class="wire-label" fill="#15598f">HDMI video</text>
  <path d="M865 222 H900 V275 H930" class="control"/>
  <text x="899" y="294" text-anchor="middle" class="wire-label" fill="#15598f">Touch</text>
  <path d="M1042 177 V205" class="control"/>
  <text x="1093" y="194" text-anchor="middle" class="wire-label" fill="#15598f">Storage</text>

  <!-- Digital source selection -->
  <rect x="30" y="480" width="1140" height="310" rx="22" fill="#fff7f2" stroke="#c7471a" class="zone"/>
  <text x="55" y="515" class="zone-title" fill="#9f3717">Digital sources &amp; input selection</text>

  <rect x="65" y="565" width="205" height="90" rx="14" fill="#fff" stroke="#777" class="node"/>
  <text x="167" y="601" text-anchor="middle" class="box-title">USB Amanero</text>
  <text x="167" y="627" text-anchor="middle" class="small">USB audio input</text>

  <rect x="350" y="555" width="235" height="135" rx="16" fill="#f7d8ca" stroke="#c7471a" class="node"/>
  <text x="467" y="594" text-anchor="middle" class="box-title">StationPi Pro</text>
  <text x="467" y="619" text-anchor="middle" class="box-title">source switch</text>
  <text x="467" y="656" text-anchor="middle" class="small">Selects digital input</text>

  <rect x="690" y="535" width="250" height="205" rx="18" fill="#f6f6f6" stroke="#777" stroke-dasharray="7 5" class="zone"/>
  <text x="815" y="562" text-anchor="middle" class="box-title">ReceiverPi Pro II</text>
  <rect x="715" y="578" width="200" height="42" rx="9" fill="#fff" stroke="#999" class="node"/>
  <text x="815" y="605" text-anchor="middle" class="small">Coaxial S/PDIF</text>
  <rect x="715" y="630" width="200" height="42" rx="9" fill="#fff" stroke="#999" class="node"/>
  <text x="815" y="657" text-anchor="middle" class="small">Optical (TOSLINK)</text>
  <rect x="715" y="682" width="200" height="42" rx="9" fill="#fff" stroke="#999" class="node"/>
  <text x="815" y="709" text-anchor="middle" class="small">HDMI / I²S</text>

  <path d="M1085 305 V535 H467 V555" class="audio"/>
  <text x="710" y="527" text-anchor="middle" class="wire-label" fill="#9f3717">Raspberry Pi I²S</text>
  <path d="M270 610 H350" class="audio"/>
  <path d="M715 600 H585" class="audio"/>
  <path d="M715 651 H620 V625 H585" class="audio"/>
  <path d="M715 704 H650 V655 H585" class="audio"/>

  <!-- Reclocking and DAC paths -->
  <rect x="30" y="815" width="1140" height="750" rx="22" fill="#f8f8f6" stroke="#777" class="zone"/>
  <text x="55" y="850" class="zone-title">Reclocking, conversion &amp; analogue output</text>

  <rect x="410" y="890" width="350" height="90" rx="16" fill="#f7d8ca" stroke="#c7471a" class="node"/>
  <text x="585" y="926" text-anchor="middle" class="box-title">FIFOPi Q7 reclocker</text>
  <text x="585" y="952" text-anchor="middle" class="small">Reclocks selected I²S source</text>
  <path d="M467 690 V860 H585 V890" class="audio"/>
  <text x="616" y="854" class="wire-label" fill="#9f3717">Selected I²S</text>

  <rect x="65" y="900" width="230" height="85" rx="14" fill="#e7f1fc" stroke="#1769aa" class="node"/>
  <text x="180" y="936" text-anchor="middle" class="box-title">MonitorPi Pro</text>
  <text x="180" y="962" text-anchor="middle" class="small">Monitor / control interface</text>
  <path d="M295 942 H360 V965 H410" class="control"/>
  <path d="M295 910 H310 V875 H1150 V735 H940" class="control"/>
  <text x="1000" y="865" text-anchor="middle" class="wire-label" fill="#15598f">ReceiverPi control</text>

  <rect x="90" y="1050" width="440" height="330" rx="18" fill="#eef5fc" stroke="#1769aa" class="zone"/>
  <text x="310" y="1082" text-anchor="middle" class="zone-title" fill="#15598f">ESS DAC path</text>
  <rect x="165" y="1110" width="290" height="62" rx="12" fill="#fff" stroke="#1769aa" class="node"/>
  <text x="310" y="1148" text-anchor="middle" class="box-title">ESS DAC · delta-sigma</text>
  <rect x="165" y="1190" width="290" height="62" rx="12" fill="#fff" stroke="#1769aa" class="node"/>
  <text x="310" y="1216" text-anchor="middle" class="small">ESS DAC I/V and</text>
  <text x="310" y="1237" text-anchor="middle" class="small">output stage</text>
  <rect x="165" y="1270" width="290" height="62" rx="12" fill="#fff" stroke="#1769aa" class="node"/>
  <text x="310" y="1296" text-anchor="middle" class="small">Balanced-to-single-ended</text>
  <text x="310" y="1317" text-anchor="middle" class="small">buffer</text>

  <rect x="670" y="1050" width="440" height="330" rx="18" fill="#f4effa" stroke="#7449c6" class="zone"/>
  <text x="890" y="1082" text-anchor="middle" class="zone-title" fill="#56359a">ProtoDAC path</text>
  <rect x="745" y="1110" width="290" height="62" rx="12" fill="#fff" stroke="#7449c6" class="node"/>
  <text x="890" y="1148" text-anchor="middle" class="box-title">ProtoDAC · multi-bit NOS</text>
  <rect x="745" y="1190" width="290" height="62" rx="12" fill="#fff" stroke="#7449c6" class="node"/>
  <text x="890" y="1216" text-anchor="middle" class="small">Single-ended-to-balanced</text>
  <text x="890" y="1237" text-anchor="middle" class="small">output buffer</text>
  <rect x="745" y="1270" width="290" height="62" rx="12" fill="#fff" stroke="#7449c6" class="node"/>
  <text x="890" y="1296" text-anchor="middle" class="small">Direct single-ended</text>
  <text x="890" y="1317" text-anchor="middle" class="small">ProtoDAC output</text>

  <path d="M500 980 V1025 H310 V1110" class="audio"/>
  <path d="M670 980 V1025 H890 V1110" class="audio"/>
  <path d="M310 1172 V1190" class="audio"/>
  <path d="M310 1252 V1270" class="audio"/>
  <path d="M890 1172 V1190" class="audio"/>
  <path d="M890 1172 H1060 V1300 H1035" class="audio"/>
  <path d="M890 1252 V1270" class="audio"/>

  <rect x="405" y="1400" width="390" height="75" rx="15" fill="#e9e9e7" stroke="#50545a" class="node"/>
  <text x="600" y="1432" text-anchor="middle" class="box-title">DAC source selector</text>
  <text x="600" y="1456" text-anchor="middle" class="small">Selects ESS or ProtoDAC output</text>
  <path d="M310 1332 V1380 H500 V1400" class="audio"/>
  <path d="M890 1332 V1380 H600 V1400" class="audio"/>
  <path d="M600 1332 V1370 H700 V1400" class="audio"/>

  <circle cx="500" cy="1525" r="38" fill="#fff" stroke="#50545a" stroke-width="2"/>
  <text x="500" y="1521" text-anchor="middle" class="small">RCA</text>
  <text x="500" y="1540" text-anchor="middle" class="tiny">OUT</text>
  <circle cx="700" cy="1525" r="38" fill="#fff" stroke="#50545a" stroke-width="2"/>
  <text x="700" y="1521" text-anchor="middle" class="small">XLR</text>
  <text x="700" y="1540" text-anchor="middle" class="tiny">OUT</text>
  <path d="M500 1475 V1487" class="analog"/>
  <path d="M700 1475 V1487" class="analog"/>

  <!-- Legend -->
  <rect x="820" y="1400" width="315" height="150" rx="14" fill="#fff" stroke="#aaa"/>
  <text x="845" y="1430" class="box-title">Connection legend</text>
  <path d="M845 1460 H925" class="control"/>
  <text x="943" y="1465" class="small">Control / touch / display</text>
  <path d="M845 1490 H925" class="audio"/>
  <text x="943" y="1495" class="small">Digital / analogue audio signal</text>
  <path d="M845 1520 H925" class="ble"/>
  <text x="943" y="1525" class="small">Bluetooth LE GATT</text>
  <text x="845" y="1544" class="tiny" fill="#666">Arrowheads show signal / command direction.</text>
</svg>
